# Builds BOTH Trusted Web Activities, proves each will actually verify against
# its own live origin, and cuts one GitHub release carrying both APKs.
#
# TWO APPS, ONE TAG. `com.boostmebitch` wraps www.boostmebitch.com and
# `com.boostmebuddy` wraps www.boostmebuddy.com. They are separate Android apps,
# not one app with two names — package id, host and Digital Asset Links
# statement move together, and Zapstore keys an app on package id plus signing
# certificate, so this is not reversible after a first publish. The matrix on
# the job is the whole of it; every step below reads one selected
# android/twa-manifest.json and stays brand-agnostic.
#
# ONLY THE FAMILY-FRIENDLY BRAND IS LISTED ON ZAPSTORE (`store: true` in the
# matrix). The other is attached to the GitHub release as an APK for anyone who
# wants it, and never reaches a store. Both halves of that are announced in the
# run summary, because a reader who finds one listing should not have to guess
# whether the second failed.
#
# WHETHER CI PUBLISHES THE LISTED ONE IS DECLARED, NOT INFERRED. The
# repository variable ZAPSTORE_PUBLISH_MODE picks it, and it defaults to
# `local` when unset:
#
#   local  (default)  CI stops after the GitHub release and prints the exact
#                     zsp commands in the run summary. A human runs them with
#                     SIGN_WITH=browser and signs in a NIP-07 browser, so the
#                     publishing key never enters GitHub. This is how the
#                     sibling app releases, and it puts the publish beside
#                     `zsp identity --link-key`, which needs the keystore and
#                     is a local step either way.
#   ci                CI publishes, and ZAPSTORE_SIGN_WITH must hold an
#                     nsec1…/bunker:// for the pubkey the listed brand's
#                     zapstore config declares.
#                     A tag with the mode set and the secret missing FAILS
#                     early rather than releasing to GitHub and stopping.
#
# The web app deploys through Vercel and is not built here — this workflow only
# wraps it. Reasoning and the first-release runbook are in docs/android.md.
#
# Nothing publishes without a tag, and the `publish` toggle cannot override
# that — it only decides whether a run ALREADY on a tag ref publishes.
# `workflow_dispatch` on a branch builds, checks, dry-runs the Zapstore listing
# against the built APK and uploads the APK as an artifact, so the whole path —
# zsp included — can be exercised before any tag exists and before the Zapstore
# signing key does.
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Zapstore — requires a vMAJOR.MINOR.PATCH tag as the ref (off = build and verify only)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  # Never cancel: a half-published release is worse than a queued one.
  cancel-in-progress: false

env:
  # zsp is pinned for the same reason nostr-tools is pinned to an exact version.
  # Bubblewrap is pinned too, but in package.json's android:* scripts — CI runs
  # the same commands a local release does, so the version lives in one place
  # and a local build cannot silently differ from the published one.
  #
  # v0.4.9 -> v0.4.17 for one reason, and it is not currency. v0.4.9 REJECTS a
  # Java keystore outright — internal/identity/x509.go returns ErrJKSFormat on
  # the JKS magic bytes — so `zsp identity --link-key <the release .jks>` could
  # not run at all, and that command is the only way to prove the signing
  # certificate belongs to the publishing npub. v0.4.17 loads a JKS directly
  # (keystore-go/v4) and adds --key-alias for it. See docs/android.md step 7.
  #
  # Verified against v0.4.17's source before the bump, because the dry-run step
  # below depends on all three: --quiet, --offline and --check are still defined
  # in internal/cli/options.go, outputOffline still writes one JSON event per
  # line to stdout, and internal/config/config.go is purely additive since
  # v0.4.9, so zapstore.yaml still parses. What changed and does NOT reach us:
  # metadata_sources now defaults to Fastlane-first (we set `github` explicitly)
  # and images are compressed (icon <=512px, screenshots <=1440px wide; ours are
  # 512x512 and 824x1830, so nothing downscales and --no-compress is not needed).
  ZSP_VERSION: v0.4.17

jobs:
  release:
    runs-on: ubuntu-latest
    # ONE TAG BUILDS BOTH APPS. They wrap different ORIGINS, so they are two
    # Android apps and not one app with two names: the package id, the host and
    # the Digital Asset Links statement all move together, and Zapstore
    # identifies an app by package id plus signing certificate. Renaming one
    # into the other is not possible after the first publish.
    #
    # Only ONE of them is listed on Zapstore. `store: true` picks it, and it is
    # the family-friendly brand; the other ships as an APK on the GitHub release
    # for people who want it. That is a product decision, recorded here because
    # nothing else in the repo would say it.
    #
    # They share ONE keystore, which is why `signingKey.alias` still reads
    # `boostmebitch` in both TWA manifests. An alias is keystore-internal and
    # never reaches a user; the differing package ids are what make these
    # separate apps.
    #
    # fail-fast is off so a failure on one brand still produces the other's APK.
    # A half-finished release is recoverable by re-running; losing the good half
    # because the other broke is just a longer wait.
    strategy:
      fail-fast: false
      matrix:
        include:
          - brand: bitch
            origin: https://www.boostmebitch.com
            twa: android/twa-manifest.json
            config: zapstore.yaml
            apk: android/app-release-signed.apk
            store: false
          - brand: buddy
            origin: https://www.boostmebuddy.com
            twa: android/twa-manifest-buddy.json
            config: zapstore-buddy.yaml
            apk: android/app-release-signed-buddy.apk
            store: true
    env:
      ORIGIN: ${{ matrix.origin }}
    steps:
      - uses: actions/checkout@v4

      # Every later step reads android/twa-manifest.json — the version step, the
      # version writer, Bubblewrap's `update`, and the package id the origin
      # check compares. Selecting the brand's file into that one path keeps all
      # of them brand-agnostic, rather than threading `matrix.twa` through five
      # places where one could be missed.
      - name: Select the brand's TWA manifest
        run: |
          set -euo pipefail
          if [ "${{ matrix.twa }}" != "android/twa-manifest.json" ]; then
            cp "${{ matrix.twa }}" android/twa-manifest.json
          fi
          echo "Building ${{ matrix.brand }} from ${{ matrix.twa }}:"
          jq -r '"  packageId \(.packageId)\n  host      \(.host)\n  name      \(.name)"' android/twa-manifest.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Bubblewrap drives Gradle. It will otherwise download its own JDK and
      # Android SDK into ~/.bubblewrap on first run, which is slow and
      # interactive; the config written below points it at the runner's instead.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Derive the version, and decide whether this run may publish
        id: version
        run: |
          set -euo pipefail
          # Branch on the REF, never on the event. A workflow_dispatch can be
          # launched against a tag ref, and deriving the version from the event
          # then builds that tag carrying whatever version the COMMITTED
          # manifest happens to hold — so a run that looks like "release
          # v1.2.3" publishes 0.1.0/100 and the tag's own version never ships.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH — refusing to build."
              exit 1
            fi
            NAME="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            MAJOR=$(( 10#${BASH_REMATCH[1]} ))
            MINOR=$(( 10#${BASH_REMATCH[2]} ))
            PATCH=$(( 10#${BASH_REMATCH[3]} ))
            # Each component gets its own THOUSAND-wide block, so no two tags
            # can land on the same code. The first shape here was
            # major*10000 + minor*100 + patch, which collides as soon as a
            # component reaches 100: v0.1.100 and v0.2.0 both produce 200, and
            # v1.0.100 collides with v1.1.0. Android refuses to install an
            # update whose versionCode is not STRICTLY greater than the
            # installed one and Zapstore keys releases on it, so the second of
            # a colliding pair can never ship as an upgrade to the first.
            #
            # The block width is bounded on the other side too: Android's
            # versionCode is a signed 32-bit int capped at 2100000000, so the
            # tag components are refused at 1000 rather than silently wrapping.
            for COMPONENT in "$MAJOR" "$MINOR" "$PATCH"; do
              if [ "$COMPONENT" -ge 1000 ]; then
                echo "::error::Tag '$TAG' has a component of 1000 or more, which the version code cannot encode."
                exit 1
              fi
            done
            # Deterministic, monotonic and readable: 0.1.0 -> 1000,
            # 1.2.3 -> 1002003. Derived from the tag rather than from
            # github.run_number, which is monotonic but meaningless and would
            # change the version code on a plain re-run of the same release.
            CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
            IS_TAG=true
          else
            # A dry run keeps whatever the manifest already carries.
            NAME=$(jq -r .appVersion android/twa-manifest.json)
            CODE=$(jq -r .appVersionCode android/twa-manifest.json)
            IS_TAG=false
          fi

          # One decision, computed once, read by every step that ships
          # something. Both publishing steps used to test the REF alone, which
          # is true of a workflow_dispatch launched against a tag — so the
          # `publish` toggle read "off = build and verify only" and published
          # anyway.
          #
          # `inputs.publish` is null on a push, so the `|| false` is what keeps
          # `set -u` and the string compare honest.
          REQUESTED='${{ inputs.publish || false }}'
          PUBLISH=false
          if [ "$IS_TAG" = true ]; then
            if [ "${{ github.event_name }}" = "push" ] || [ "$REQUESTED" = "true" ]; then
              PUBLISH=true
            fi
          elif [ "$REQUESTED" = "true" ]; then
            # Refuse rather than skip. A guard that silently withholds reads as
            # a broken workflow: the run goes green, the APK is attached to
            # nothing, and the reason is nowhere on screen.
            echo "::error::publish was requested, but $GITHUB_REF is not a tag. Nothing publishes without a vMAJOR.MINOR.PATCH tag — re-run this workflow with the tag selected as the ref."
            exit 1
          fi

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Building $NAME (versionCode $CODE), publish=$PUBLISH"

      # WHO publishes to Zapstore is a DECLARED decision, never an inference
      # from whether a secret happens to exist.
      #
      # This repo's answer is `local`: a human runs zsp with SIGN_WITH=browser
      # and signs in a NIP-07 browser, which is how the sibling app releases and
      # what keeps the publishing key out of GitHub entirely. CI still builds,
      # signs, verifies the origin and cuts the GitHub release.
      #
      # An earlier draft of this workflow FAILED a tag whenever
      # ZAPSTORE_SIGN_WITH was absent, reasoning that a silent skip is the
      # pattern CLAUDE.md names under "a guard that silently withholds must say
      # so". That reasoning is right and the test was wrong: absent-secret is
      # the NORMAL state under `local`, so the guard fired on every tag this
      # repo ever intends to push. Keying it on the declared mode keeps the
      # loud failure exactly where it belongs — mode `ci` with no key — and
      # makes `local` an announcement rather than a silence.
      - name: Resolve the Zapstore publish mode
        id: zapmode
        env:
          MODE: ${{ vars.ZAPSTORE_PUBLISH_MODE }}
        run: |
          set -euo pipefail
          M="${MODE:-local}"
          case "$M" in
            local|ci) ;;
            *) echo "::error::ZAPSTORE_PUBLISH_MODE is '$M'. It must be 'local' or 'ci' — see docs/android.md."; exit 1 ;;
          esac
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "Zapstore publish mode: $M"

      # Only under mode `ci`. Fails in seconds, before the keystore is
      # materialized and long before `gh release create` runs, because the check
      # in the publish step itself runs AFTER the GitHub release exists — where
      # a missing key leaves a release on GitHub and nothing on Zapstore.
      #
      # The value is never echoed. `-z` on the secret is the whole test.
      - name: Refuse a publish run with no Zapstore identity
        if: matrix.store && steps.version.outputs.publish == 'true' && steps.zapmode.outputs.mode == 'ci'
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
        run: |
          set -euo pipefail
          if [ -z "${SIGN_WITH:-}" ]; then
            echo "::error::ZAPSTORE_PUBLISH_MODE is 'ci' but ZAPSTORE_SIGN_WITH is not set, so this tag cannot publish. Add the repository secret (the key for the pubkey ${{ matrix.config }} declares), or set the variable back to 'local' and publish by hand — see docs/android.md."
            exit 1
          fi
          echo "ZAPSTORE_SIGN_WITH is set."

      - name: Write the version into the TWA manifest
        run: |
          set -euo pipefail
          jq --arg v '${{ steps.version.outputs.name }}' \
             --argjson c '${{ steps.version.outputs.code }}' \
             '.appVersion = $v | .appVersionCode = $c' \
             android/twa-manifest.json > android/twa-manifest.tmp
          mv android/twa-manifest.tmp android/twa-manifest.json

      - name: Materialize the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty. Create the release keystore and add it as a repository secret — see docs/android.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/android.keystore
          chmod 600 android/android.keystore

      # WRITE THE CONFIG FILE RATHER THAN ASKING BUBBLEWRAP TO CREATE IT.
      #
      # `bubblewrap updateConfig --jdkPath … --androidSdkPath …` looks like the
      # non-interactive way to do this and is not. On a runner there is no
      # ~/.bubblewrap/config.json at all, so the CLI enters its first-run setup
      # BEFORE it considers either flag, and asks:
      #
      #   ? Do you want Bubblewrap to install the JDK (recommended)?
      #     (Enter "No" to use your own JDK 17 installation) (Y/n)
      #
      # With no TTY that exits 130 (SIGINT) about twelve seconds in, and the
      # log shows a half-drawn prompt rather than an error — it reads like the
      # job was cancelled. Observed on run 32486514158, the first ever run.
      #
      # The file is two fields and is exactly what `updateConfig` would have
      # written, so writing it costs nothing and removes the question. It also
      # has to exist BEFORE `updateConfig` runs, which is why this is its own
      # step rather than a line inside the build.
      - name: Point Bubblewrap at the runner's JDK and Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bubblewrap"
          jq -n --arg jdk "$JAVA_HOME" --arg sdk "$ANDROID_HOME" \
             '{jdkPath: $jdk, androidSdkPath: $sdk}' \
             > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Build the signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Redirect stdin from /dev/null throughout. Every Bubblewrap
          # subcommand can prompt, and a prompt with a TTY-less stdin that is
          # still OPEN hangs the job for six hours instead of failing; closed,
          # it fails in seconds with the question visible in the log.
          npm run android:config < /dev/null
          # `update`, not `init`: it regenerates the Android project from
          # twa-manifest.json, which is what lets one JSON file be the only
          # source in git. --skipVersionUpgrade because the step above already
          # set both version fields; letting Bubblewrap auto-increment would
          # make the version code depend on how many times this workflow ran.
          npm run android:update < /dev/null
          # --skipPwaValidation has a repo-specific reason, not a lazy one:
          # Bubblewrap's Quality Criteria check evaluates offline support, and
          # public/sw.js deliberately precaches nothing (see docs/ui.md). The
          # validation would fail on a property this app has consciously chosen.
          npm run android:release < /dev/null
          # Bubblewrap always writes android/app-release-signed.apk. Give the
          # brand its own filename NOW, before anything reads it: every later
          # step, the release asset and the brand's zapstore config all name
          # that path, so the two legs cannot hand each other an APK.
          if [ "${{ matrix.apk }}" != "android/app-release-signed.apk" ]; then
            mv android/app-release-signed.apk "${{ matrix.apk }}"
          fi

      - name: Read the certificate out of what was actually built
        id: cert
        run: |
          set -euo pipefail
          FP=$(keytool -printcert -jarfile "${{ matrix.apk }}" \
               | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d '[:space:]')
          PKG=$(jq -r .packageId android/twa-manifest.json)
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          {
            echo "### Android build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| package | \`$PKG\` |"
            echo "| version | ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }}) |"
            echo "| SHA-256 | \`$FP\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.brand }}-app-release-signed-${{ steps.version.outputs.name }}
          # Named explicitly, never a glob over android/ — the keystore is in
          # that directory and must not be swept into an artifact.
          path: ${{ matrix.apk }}
          if-no-files-found: error

      # The best guard in this workflow. A statement list that does not name
      # this exact certificate is invisible from the web side — Chrome logs
      # nothing, returns nothing, and simply declines to verify — so without
      # this check the first sign of trouble is a URL bar on somebody's phone
      # after the app has already been published.
      #
      # It compares against the DEPLOYED route rather than a repo variable,
      # because a repo variable is a second copy that drifts. This catches "the
      # Vercel env var was never set", "the key was rotated but the env wasn't"
      # and "Vercel hasn't redeployed yet" alike.
      #
      # On the first release this will fail, by design: the fingerprint does not
      # exist until the keystore does. The APK is already uploaded by then and
      # the message prints exactly what to paste into ANDROID_CERT_SHA256, so
      # nothing is lost — set it, redeploy, re-run.
      - name: Verify the origin will accept this certificate
        run: |
          set -euo pipefail
          FP='${{ steps.cert.outputs.fingerprint }}'
          PKG='${{ steps.cert.outputs.package }}'
          LIVE=$(curl -fsS "$ORIGIN/.well-known/assetlinks.json")
          if echo "$LIVE" | jq -e --arg pkg "$PKG" --arg fp "$FP" \
               'any(.[]; .target.package_name == $pkg and (.target.sha256_cert_fingerprints | index($fp)))' > /dev/null; then
            echo "$ORIGIN vouches for $PKG with this certificate."
          else
            echo "::error::$ORIGIN does not vouch for this build, so the app would open with a URL bar."
            echo "Live statement list:"
            echo "$LIVE"
            echo ""
            echo "Set ANDROID_PACKAGE_ID=$PKG and add this fingerprint to ANDROID_CERT_SHA256 in Vercel"
            echo "(comma-separate to keep an outgoing key live during a rotation), redeploy, then re-run:"
            echo "  $FP"
            exit 1
          fi

      # Installed on EVERY run, not only when publishing, because the dry run
      # below is the only thing standing between a tag push and a publish step
      # nobody has ever executed. The pin is the same one the publish step uses.
      - name: Install zsp
        run: |
          set -euo pipefail
          go install github.com/zapstore/zsp@${ZSP_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Two dry runs against the APK that was just built, both keyless and both
      # sending nothing. Together they are docs/android.md's runbook step 5,
      # moved into CI so it cannot be forgotten:
      #
      #   --check   loads zapstore.yaml, validates it, and proves release_source
      #             resolves to a parseable APK.
      #   --offline with SIGN_WITH set to the npub zapstore.yaml declares builds
      #             the kind 32267/30063/3063 events UNSIGNED and writes them to
      #             stdout instead of uploading or publishing. That exercises
      #             what --check does not: every image path resolves, the
      #             CHANGELOG has a section for this version, the icon URL
      #             downloads, and the declared pubkey passes zsp's own
      #             mismatch check.
      #
      # This step exists because the publish step shipped with `zsp publish -y`,
      # which zsp rejects at every version ("flag provided but not defined: -y")
      # — and nothing before a real tag push would ever have run it. A tag would
      # have built, verified, created the GitHub release, and failed on the last
      # step. The CI form is --quiet; -y was never a zsp flag.
      - name: Dry-run the Zapstore listing against the built APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zsp publish --check "${{ matrix.config }}"
          NPUB=$(awk '$1 == "pubkey:" { print $2 }' "${{ matrix.config }}")
          if [ -z "$NPUB" ]; then
            echo "::error::${{ matrix.config }} declares no pubkey, so the dry run has no identity to build events for."
            exit 1
          fi
          # Events go to stdout, the upload manifest (and any error) to stderr.
          # Both are kept and the stderr half is printed on failure, because a
          # `set -e` exit on the redirect alone would hide zsp's own message.
          EVENTS="$RUNNER_TEMP/zapstore-events.jsonl"
          STDERR="$RUNNER_TEMP/zapstore-offline-stderr.txt"
          if ! SIGN_WITH="$NPUB" zsp publish --quiet --offline "${{ matrix.config }}" > "$EVENTS" 2> "$STDERR"; then
            echo "::error::zsp publish --offline failed. Its stderr:"
            cat "$STDERR"
            exit 1
          fi
          COUNT=$(grep -c '"kind"' "$EVENTS" || true)
          echo "zsp built $COUNT unsigned event(s) for $NPUB; nothing was uploaded or published."
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::zsp produced no events in --offline mode. Its stderr:"
            cat "$STDERR"
            exit 1
          fi

      - name: Attach the APK to the GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF#refs/tags/}" --generate-notes --verify-tag 2>/dev/null || true
          gh release upload "${GITHUB_REF#refs/tags/}" "${{ matrix.apk }}" --clobber

      # Mode `local`: say what is left to do, on the run that produced the APK,
      # rather than leaving a green tag that silently reached no store. The
      # commands are written out in full because the person running them is
      # doing it once or twice a year and should not have to reconstruct them.
      # Mode `local`: say what is left to do, on the run that produced the APK,
      # rather than leaving a green tag that silently reached no store. The
      # commands are written out in full because the person running them is
      # doing it once or twice a year and should not have to reconstruct them.
      - name: Hand the Zapstore publish to a human
        if: matrix.store && steps.version.outputs.publish == 'true' && steps.zapmode.outputs.mode == 'local'
        env:
          TAG: ${{ github.ref_name }}
          APK: ${{ matrix.apk }}
          CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          ASSET=$(basename "$APK")
          {
            echo "## Zapstore: ${{ matrix.brand }} is not published by CI"
            echo
            echo "\`ZAPSTORE_PUBLISH_MODE\` is \`local\`, so this run built, signed, verified and released **$TAG** and stopped there."
            echo "The signing key stays off GitHub on purpose. Finish it on the machine that holds the keystore:"
            echo
            echo '```bash'
            echo "gh release download $TAG -p '$ASSET' -O $APK --clobber"
            echo "SIGN_WITH=browser zsp publish $CONFIG          # signs in a NIP-07 browser"
            echo "SIGN_WITH=browser zsp identity --link-key ~/keystores/boostmebitch-release.jks --key-alias boostmebitch"
            echo '```'
            echo
            echo "\`$CONFIG\` names \`$APK\` as its \`release_source\`, so the download has to land on exactly that path."
            echo "Then confirm from the relay rather than the log — see \`docs/android.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Zapstore publish for ${{ matrix.brand }} is a LOCAL step. The commands are in this run's summary."

      # The other brand never reaches a store, and that is a decision rather
      # than an omission — so the run says so, on the run that built it. A
      # reader who finds only one Zapstore listing should not have to guess
      # whether the second one failed.
      - name: Note that this brand is GitHub-only
        if: ${{ !matrix.store && steps.version.outputs.publish == 'true' }}
        env:
          APK: ${{ matrix.apk }}
        run: |
          set -euo pipefail
          {
            echo "## ${{ matrix.brand }}: GitHub release only, by design"
            echo
            echo "\`$(basename "$APK")\` is attached to this release for anyone who wants it."
            echo "It is deliberately **not** listed on Zapstore — only the family-friendly brand is."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to Zapstore
        if: matrix.store && steps.version.outputs.publish == 'true' && steps.zapmode.outputs.mode == 'ci'
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A backstop. "Refuse a publish run with no Zapstore identity", near
          # the top, already failed this run — before the keystore existed and
          # before the GitHub release did. Reaching here means that step was
          # removed or its condition drifted from this one.
          if [ -z "${SIGN_WITH:-}" ]; then
            echo "::error::ZAPSTORE_SIGN_WITH is not set, so this tag cannot publish. Add the repository secret (the key for the pubkey ${{ matrix.config }} declares) and re-run this workflow — see docs/android.md."
            exit 1
          fi
          # --quiet is zsp's CI mode: no prompts, no spinners, auto-confirm.
          # (`-y` was never a zsp flag; zsp rejects it outright.) In quiet
          # mode a missing certificate-to-identity proof is a warning, not a
          # prompt — link it once by hand afterwards, per docs/android.md.
          zsp publish --quiet "${{ matrix.config }}"

      - name: Remove the keystore
        if: always()
        run: rm -f android/android.keystore
